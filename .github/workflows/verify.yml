name: Verify

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Snek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Run tests
        run: npm test

      - name: Build versioned site
        run: node tools/build-site.mjs . _site "$GITHUB_SHA"

      - name: Build and lint Android app
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug lintDebug

      - name: Check patch formatting
        run: git diff --check origin/main...HEAD
