name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for the verified pull request to merge
        id: deploy-source
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy_ref=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$HEAD_BRANCH" == "main" ]]; then
            echo "deploy_ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in {1..120}; do
            pr_data="$(gh pr list \
              --repo "$GH_REPO" \
              --base main \
              --head "$HEAD_BRANCH" \
              --state all \
              --json state,headRefOid,mergeCommit \
              --jq '.[0] // {}')"
            pr_state="$(jq -r '.state // empty' <<< "$pr_data")"
            pr_head="$(jq -r '.headRefOid // empty' <<< "$pr_data")"

            if [[ "$pr_state" == "MERGED" && "$pr_head" == "$HEAD_SHA" ]]; then
              merge_sha="$(jq -r '.mergeCommit.oid // empty' <<< "$pr_data")"
              if [[ -n "$merge_sha" ]]; then
                echo "deploy_ref=$merge_sha" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            if [[ "$pr_state" == "CLOSED" ]]; then
              echo "The verified pull request closed without a merge." >&2
              exit 1
            fi

            sleep 5
          done

          echo "The verified pull request did not merge within ten minutes." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.deploy-source.outputs.deploy_ref }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' >/dev/null

      - name: Prepare Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SNEK_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SNEK_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SNEK_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SNEK_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Android signing secrets are not configured." >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/snek-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "SNEK_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "SNEK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SNEK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SNEK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "SNEK_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "SNEK_VERSION_NAME=0.2.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

      - name: Build signed Android APK
        working-directory: android
        run: bash gradlew --no-daemon assembleRelease lintRelease

      - name: Build versioned site
        run: node tools/build-site.mjs . _site "$(git rev-parse HEAD)"

      - name: Add latest Android APK to site
        shell: bash
        run: |
          set -euo pipefail
          apk_source="android/app/build/outputs/apk/release/app-release.apk"
          apk_target="_site/downloads/snek-latest.apk"
          mkdir -p "$(dirname "$apk_target")"
          cp "$apk_source" "$apk_target"
          sha256="$(sha256sum "$apk_target" | cut -d' ' -f1)"
          jq -n \
            --arg commit "$(git rev-parse HEAD)" \
            --arg version "$SNEK_VERSION_NAME" \
            --arg sha256 "$sha256" \
            '{commit: $commit, version: $version, sha256: $sha256}' \
            > _site/downloads/snek-latest.json

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snek-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
